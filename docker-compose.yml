version: '3.9'

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: wareflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowstock
      POSTGRES_USER: ashishbhardwaj
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wareflow_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashishbhardwaj -d flowstock"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wareflow-net

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wareflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wareflow-net

  # ── MailHog (dev email server — UI at localhost:8025) ────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: wareflow-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"    # SMTP
      - "8025:8025"    # Web UI
    networks:
      - wareflow-net

  # ── Auth Service ────────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: wareflow-auth-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flowstock
      DB_USERNAME: ashishbhardwaj
      DB_PASSWORD: ${DB_PASSWORD:-wareflow_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-bXlTdXBlclNlY3JldEtleVRoYXRJc0F0TGVhc3Q2NENoYXJhY3RlcnNMb25nRm9yU2VjdXJpdHk=}
      JWT_ACCESS_EXPIRY: 900
      JWT_REFRESH_EXPIRY: 2592000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-REPLACE_ME}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-REPLACE_ME}
      FRONTEND_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      COOKIE_DOMAIN: localhost
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wareflow-net

  # ── React Frontend ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wareflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - auth-service
    networks:
      - wareflow-net

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  wareflow-net:
    driver: bridge
